port: 8080

auth:
  token: "${REVIEW_TOKEN}"

database:
  dsn: "${DATABASE_URL}"
  max_idle_conns: 10
  max_open_conns: 50

review:
  worker_concurrency: 4
  worker_poll_interval: "2s"
  worker_stale_after: "15m"
  max_diff_bytes: 5242880

# OCR、策略、Git 平台等业务配置已迁移到数据库，通过 Web 控制台管理。

# 可信反向代理（可选）：本服务通常跑在 nginx 之后，nginx 会写 X-Forwarded-For。
# 填了这里的网段后，访问日志与限流分桶才按**真实客户端 IP** 计算；
# 留空 = 不信任任何代理头（来源 IP 记为 TCP 对端地址，即 nginx 的地址）。
# 非法条目会让服务启动失败（配置错误在启动那一刻暴露，不静默降级）。
# proxy:
#   trusted_proxies:
#     - 172.16.0.0/12   # docker 默认网段（compose 本机部署）
#     - 10.42.0.0/16    # k8s pod 网段（按集群实际调整）
nacos:
  addr: "${NACOS_ADDR}"
  namespace_id: "${NACOS_NAMESPACE}"
  service_name: "review-service"

tracing:
  endpoint: "${OTEL_ENDPOINT}"
  insecure: true
  sample_rate: 1.0

# Argus 对接（可选）
# Argus Bot（外部 PR 审查引擎）基地址与 API token（即 argus 侧 ARGUS_APITOKEN）。
# bot_url 为空 = argus 引擎整体关闭（创建期 fail-fast、轮询器与反馈回流不启动）。
# 也可用环境变量 ARGUS_BOT_URL / ARGUS_BOT_TOKEN 覆盖。
# argus:
#   bot_url: "http://argus:8899"
#   bot_token: "${ARGUS_BOT_TOKEN:}"
# 对外基地址：PR 门禁 check 跳转评审详情页链接；留空则不携带 target_url
# external_base_url: http://review.example.com
