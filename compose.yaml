services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: review_service
      POSTGRES_USER: review_service
      POSTGRES_PASSWORD: review_service
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U review_service -d review_service"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - review-postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  review-service:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      REVIEW_TOKEN: ${REVIEW_TOKEN:-dev-token}
      DATABASE_URL: postgres://review_service:review_service@postgres:5432/review_service?sslmode=disable
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    depends_on:
      - review-service
    ports:
      - "80:80"

  # MCP server 独立进程 — 给 minicode / Claude Desktop / Cursor 等 LLM 客户端用。
  # streamable_http transport（MCP 2025-03 spec）：HTTP/POST /mcp，Bearer token 鉴权。
  # 复用 review-service 同一份镜像,但启动时走 cmd/mcp-server 二进制。
  mcp-server:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      review-service:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://review_service:review_service@postgres:5432/review_service?sslmode=disable
      # MCP_TOKEN 优先，fallback REVIEW_TOKEN。dev 默认 dev-token，跟主服务一致。
      MCP_TOKEN: ${MCP_TOKEN:-dev-token}
    entrypoint: ["/usr/local/bin/mcp-server", "--port=8082"]
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8082/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  review-postgres:
