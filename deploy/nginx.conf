server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Docker 内置 DNS：让 nginx 每 30s 重新解析 review-service 主机名，
    # 避免 review-service 容器重启换 IP 后还连旧 IP（导致 502）。
    # 用 set $upstream 把主机名放到变量里，nginx 才会在请求时动态解析；
    # 直接 proxy_pass http://name:port 只在 worker 启动时解析一次。
    # 变量版的 proxy_pass（无 URI 路径）会原样转发请求 URI，等价于静态 upstream 行为。
    resolver 127.0.0.11 valid=30s ipv6=off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        set $upstream_review_service review-service:8080;
        proxy_pass http://$upstream_review_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location ^~ /swagger/ {
        set $upstream_review_service review-service:8080;
        proxy_pass http://$upstream_review_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi.yaml {
        set $upstream_review_service review-service:8080;
        proxy_pass http://$upstream_review_service;
        proxy_set_header Host $host;
    }

    location /healthz {
        set $upstream_review_service review-service:8080;
        proxy_pass http://$upstream_review_service;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
