port: 8080

auth:
  token: "${REVIEW_TOKEN}"

database:
  dsn: "${DATABASE_URL}"
  max_idle_conns: 10
  max_open_conns: 50

review:
  worker_concurrency: 4
  worker_poll_interval: "2s"
  worker_stale_after: "15m"
  max_diff_bytes: 5242880

ocr:
  enabled: true
  binary: "ocr"
  rule: ""
  command: ""

policy:
  fail_on: "critical"
  max_comments: 20
  summary_only: false
  ignore_paths:
    - "vendor/**"
    - "dist/**"
    - "*.pb.go"

git:
  platforms: {}

nacos:
  addr: "${NACOS_ADDR}"
  namespace_id: "${NACOS_NAMESPACE}"
  service_name: "review-service"

tracing:
  endpoint: "${OTEL_ENDPOINT}"
  insecure: true
  sample_rate: 1.0
