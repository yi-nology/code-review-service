# review-frontend（Web 控制台，nginx 静态 + /api 反代）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-frontend
  labels:
    app: review-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: review-frontend
  template:
    metadata:
      labels:
        app: review-frontend
    spec:
      containers:
      - name: review-frontend
        image: review-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        resources:
          requests: {cpu: 100m, memory: 64Mi}
          limits: {cpu: "1", memory: 512Mi}
        readinessProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: review-frontend
spec:
  type: NodePort
  selector:
    app: review-frontend
  ports:
  - name: http
    port: 80
    nodePort: 30091
