# review-service 架构治理策略
#
# 本文件既是**声明面**（模块清单 + 依赖方向，供人阅读与 AI 对齐），也是**可执行面**
# （rules 段由 goagent-kernel/archcheck 逐条执行，`make architecture-check` 门禁，
# 违反即非零退出）。
#
# 为什么要有这个文件：AGENTS.md 里的层级规则一直是散文——「service 不该摸 ORM」
# 「domain 层不该依赖 infra」这类话靠人记，靠 review 靠不住。散文会随人手改动
# 而失效，而失效之后没人知道它曾经存在过。policy 把它们变成**可执行断言**：
# 违反即 CI 红。
#
# 纪律：
#   - 提交前跑 `make check`（含 architecture-check）；
#   - 新增内部依赖方向**先改本文件再写代码**（policy 先行）；
#   - 新模块登记 {id, roots, requires, owner}；
#   - 例外必须带注释说明原因与拆除条件；
#   - severity: warn 的规则是**已知欠账**——它们会在报告里显形但不阻断，
#     欠账还清完就升级为 error（棘轮只能收紧，不能放松）。
#
# 正则一律 RE2 语法（Go regexp 原生，不支持 (?!...)）；负向前置用
# negative_follow 结构化表达（anchor 是**字面串**，判定用 strings.Index 匹配
# 字面量，且必须位于命中起点之前或等于——所以 forbid_import_regex 不能带
# '.*' 前缀）。
version: 1

# ── 模块清单（requires = 允许的依赖方向）──
modules:
  - id: app
    roots: ['internal/app']
    requires: ['domain', 'reviewdomain']
    owner: review-service
    managed: true
    notes: 应用层抽象（端口）：对外暴露角色接口，隔离具体实现

  - id: argusclient
    roots: ['internal/argusclient']
    requires: ['ext:github.com/oekit']
    owner: review-service
    managed: true
    notes: Argus 引擎 HTTP 客户端

  - id: cmd
    roots: ['cmd/mcp-server']
    requires: ['config', 'mcp', 'modules', 'observability', 'ext:github.com/oekit']
    owner: review-service
    managed: true
    notes: MCP 服务进程入口

  - id: config
    roots: ['internal/config']
    requires: ['domain', 'ext:github.com/oekit']
    owner: review-service
    managed: true
    notes: 基础设施配置（env + yaml）

  - id: domain
    roots: ['internal/domain']
    requires: ['ext:github.com/oekit']
    owner: review-service
    managed: true
    notes: 领域类型叶子包：只依赖标准库与 oekit/pkg

  - id: eino
    roots: ['internal/eino']
    requires: ['domain', 'observability', 'ocr', 'progress', 'repository', 'reviewdomain', 'service', 'strutil', 'vcs', 'ext:github.com/cloudwego', 'ext:github.com/oagentkit', 'ext:github.com/oekit']
    owner: review-service
    managed: true
    notes: Eino 引擎适配与编排

  - id: handler
    roots: ['biz/handler']
    requires: ['app', 'argusclient', 'domain', 'model', 'ocr', 'progress', 'repository', 'reviewdomain', 'service', 'ext:github.com/cloudwego', 'ext:github.com/oekit', 'ext:gorm.io']
    owner: review-service
    managed: true
    notes: HTTP 处理器

  - id: mcp
    roots: ['internal/mcp']
    requires: ['app', 'domain', 'repository', 'reviewdomain', 'service', 'strutil', 'ext:github.com/oekit']
    owner: review-service
    managed: true
    notes: MCP 端点

  - id: middleware
    roots: ['internal/middleware']
    requires: ['domain', 'repository', 'ext:github.com/cloudwego', 'ext:github.com/oekit']
    owner: review-service
    managed: true
    notes: Hertz 中间件

  - id: model
    roots: ['biz/model']
    requires: []
    owner: review-service
    managed: true
    notes: thriftgo 生成的模型（勿手改）

  - id: modules
    roots: ['internal/modules']
    requires: ['argusclient', 'config', 'domain', 'eino', 'handler', 'middleware', 'observability', 'ocr', 'progress', 'readiness', 'repository', 'reviewdomain', 'router', 'service', 'swagger', 'ext:github.com/cloudwego', 'ext:github.com/oekit', 'ext:github.com/yi-nology/agent-memory', 'ext:gorm.io']
    owner: review-service
    managed: true
    notes: uber/fx 装配

  - id: observability
    roots: ['internal/observability']
    requires: ['ext:github.com/oagentkit', 'ext:github.com/oekit']
    owner: review-service
    managed: true
    notes: 指标与日志脱敏

  - id: ocr
    roots: ['internal/ocr']
    requires: ['domain', 'progress', 'repository', 'reviewdomain', 'ext:github.com/cloudwego', 'ext:github.com/oagentkit', 'ext:github.com/oekit', 'ext:github.com/yi-nology/goagent-kernel']
    owner: review-service
    managed: true
    notes: OCR 能力的单一入口

  - id: progress
    roots: ['internal/service/progress']
    # repository（接口包）：PhaseReader 适配器把 session 仓储读数桥接为跨副本
    # 进度降级通道（多副本部署，WS 连到非执行副本时的兜底）。接口依赖，非实现。
    requires: ['domain', 'repository', 'ext:github.com/oekit', 'ext:github.com/yi-nology/goagent-kernel']
    owner: review-service
    managed: true
    notes: 进度事件词汇与总线桥

  - id: readiness
    roots: ['internal/readiness']
    requires: ['ocr', 'repository', 'ext:github.com/oekit', 'ext:gorm.io']
    owner: review-service
    managed: true
    notes: 就绪探针

  - id: repository
    roots: ['internal/repository']
    requires: ['config', 'domain', 'reviewdomain', 'ext:github.com/oekit', 'ext:gorm.io']
    owner: review-service
    managed: true
    notes: 仓储接口与 PostgreSQL 实现

  - id: reviewdomain
    roots: ['internal/domain/review']
    requires: ['domain', 'ext:github.com/oekit']
    owner: review-service
    managed: true
    notes: 评审领域类型（当前寄居 service 路径下——见欠账规则）

  - id: root
    roots: ['.']
    requires: ['config', 'modules', 'observability', 'ext:github.com/cloudwego', 'ext:github.com/oekit']
    owner: review-service
    managed: true
    notes: 主服务入口

  - id: router
    roots: ['biz/router']
    requires: ['handler', 'ext:github.com/cloudwego']
    owner: review-service
    managed: true
    notes: HTTP 路由

  - id: service
    roots: ['internal/service']
    requires: ['argusclient', 'config', 'domain', 'observability', 'ocr', 'progress', 'repository', 'reviewdomain', 'strutil', 'vcs', 'ext:github.com/oekit', 'ext:github.com/yi-nology/goagent-kernel', 'ext:github.com/yi-nology/agent-memory']
    owner: review-service
    managed: true
    notes: 业务服务层

  - id: strutil
    roots: ['internal/strutil']
    # rune 安全的截断委托 oekit/pkg/stringx（TruncRunes），本模块只保留
    # 「截断后连省略号算在内也不超上限」这层业务语义。
    requires: ['ext:github.com/oekit']
    owner: review-service
    managed: true
    notes: 字符串工具

  - id: swagger
    roots: ['swagger']
    requires: ['ext:github.com/cloudwego']
    owner: review-service
    managed: true
    notes: Swagger UI 路由注册

  - id: vcs
    roots: ['internal/vcs']
    requires: ['ext:github.com/oagentkit', 'ext:github.com/yi-nology/goagent-kernel']
    owner: review-service
    managed: true
    notes: VCS 克隆与出站防护

# ── 依赖方向门禁 ──
#
# 只判**内部模块边**与**受管外部包面**（ext_prefixes 段列出的家族库）。
# 第三方依赖不归这张表管。
dependency_direction:
  enabled: true
  severity: error
  desc: |
    模块之间的依赖方向由 modules 段的 requires 声明。新增内部依赖方向时
    先改 architecture-policy.yaml 再写代码——policy 先行，是这份文件存在的
    全部意义。
  ext_prefixes:
    - github.com/oekit
    - github.com/oagentkit
    - github.com/yi-nology/goagent-kernel
    - github.com/yi-nology/agent-memory
    - gorm.io
    - github.com/cloudwego

# ── 结构债阈值 ──
thresholds:
  # 超长文件：机械判据。当前最长的手写文件约 714 行（internal/eino/executor.go）。
  # 阈值定在 800 是「给重构留出余量但不允许继续长胖」——文件越长越难拆。
  max_file_lines: 800
  # 上帝对象：一个类型的实质方法数上限（转发壳不计入）。
  max_methods_per_type: 30
  scan_roots:
    - internal
    - biz/handler
    - biz/router
  # enforce=false：只报告不阻断。结构债的清理是渐进的，用阻断逼人硬拆
  # 只会催生「为了过门禁而拆出无意义的壳」。
  # scan_roots 不含 biz/model：那是 thriftgo 生成代码，长度不由人控制。
  enforce: false

# ── 可执行规则 ──
#
# severity: error = 违反即非零退出（CI 红）。
# severity: warn  = 已知欠账，在报告里显形但不阻断。欠账还清完就升级为 error
# ——这道棘轮只能收紧，不能放松。
rules:
  - id: domain-no-infra-import
    desc: |
      领域层不得依赖基础设施（ORM / Web 框架 / 平台 SDK / 内核）。
      internal/domain/* 是纯类型叶子包：它一旦需要 ORM 或 Hertz，
      说明「领域」这个划分本身已经失效。
    severity: error
    scope: [internal/domain]
    ignore_test: true
    forbid_import_regex: '^(gorm\.io|github\.com/cloudwego|github\.com/yi-nology/go-git-platform|github\.com/yi-nology/goagent-kernel|github\.com/yi-nology/agent-memory)'

  - id: domain-no-internal-dep
    desc: |
      领域层不得依赖任何内部包。它是依赖图的叶子，依赖谁都行、谁都不该依赖它。
    severity: error
    scope: [internal/domain]
    ignore_test: true
    forbid_import_regex: '.*/internal/(service|repository|modules|eino|ocr|mcp|middleware|app)/'

  - id: service-no-orm
    desc: |
      业务服务层不得直接依赖 ORM（gorm.io / repository/postgres 的模型）。
      service 层只认 repository 包里的**接口**；要查库就走接口。
      （此前 internal/service/cost 直接持 *gorm.DB，是全仓唯一的例外，已修。）
    severity: error
    scope: [internal/service]
    ignore_test: true
    forbid_import_regex: '^(gorm\.io|.*/internal/repository/postgres)'

  - id: handler-no-postgres
    desc: |
      HTTP 处理器不得直接依赖 PostgreSQL 实现。handler 只认 internal/app
      暴露的角色接口与 internal/service 的服务接口——数据访问经仓储接口，
      不经实现。
    severity: error
    scope: [biz/handler]
    ignore_test: true
    forbid_import_regex: '.*/internal/repository/postgres'

  - id: router-no-repository
    desc: |
      路由层只做「路径 → handler」的映射，不得直接摸仓储或服务。
    severity: error
    scope: [biz/router]
    ignore_test: true
    forbid_import_regex: '.*/internal/(repository|service)/'

  - id: model-generated-only
    desc: |
      biz/model/* 是 thriftgo 生成代码（idl/*.thrift 的产物），不得引入
      ORM / Web 框架 / 日志库等手写依赖——生成代码的手工改动会在下次
      重新生成时静默丢失。
    severity: error
    scope: [biz/model]
    forbid_import_regex: '^(gorm\.io|github\.com/cloudwego|github\.com/oekit|github\.com/oagentkit)'

  - id: repository-no-service-dep
    desc: |
      仓储层（infra）不得依赖服务层。评审领域类型已从 internal/service/review/domain
      下沉到 internal/domain/review（纯领域叶子包，住在 service 路径下会让
      infra → service 的方向倒过来）——仓储层现在只依赖 domain 层。

      此规则**守住这条边界**：仓储层一旦重新 import 任何 internal/service/* 即报错。
    severity: error
    scope: [internal/repository]
    ignore_test: true
    forbid_import_regex: 'internal/service/'

  - id: eino-no-repository-dep
    desc: |
      引擎适配层不得直接持有仓储。前置编排（克隆工作区 → 项目策略 → 文件过滤
      → 规则合并 → 记忆召回 → OCR 执行参数）已下沉为 service/review 的
      Pipeline（端口 review.PipelineRunner），eino 只持这个窄端口与评审状态
      的窄存储接口（review.ReviewStateStore）。

      此前 eino 直接持 6 个仓储、读 5 张业务表，又反向调用 service/review 的
      13 个导出函数——两套编排互相调用，是耦合的主要来源。此规则现在**守住
      这条边界**：eino 一旦重新 import 仓储包即报错。
    severity: error
    scope: [internal/eino]
    ignore_test: true
    forbid_import_regex: 'internal/repository'

  - id: ocr-no-service-dep
    desc: |
      OCR 层不得依赖业务服务层。进度事件是**评审领域词汇**（阶段名、上报
      端口），已下沉到 internal/domain/progress：internal/ocr 要的只是阶段名
      与上报端口，不该为一个常量拖上整个服务包。

      此前 internal/ocr 依赖 internal/service/progress，只为一个阶段名常量
      与一个上报端口——而那个包里装的是 tracker / manager / websocket 桥等
      机制。此规则现在**守住这条边界**：ocr 一旦重新依赖业务服务层即报错。
    severity: error
    scope: [internal/ocr]
    ignore_test: true
    forbid_import_regex: 'internal/service/'
    negative_follow:
      - anchor: 'internal/service/'
        forbid_follow: review/domain

# ── 子进程出口登记（goagent-kernel archcheck 的 egress_paths 判据面）──
#
# 每个 os/exec 启动点都必须在这里登记出口档位（未登记即红；unrestricted 也
# 必须显式写）。本仓现状：没有进程内的出口代理强制面（无 egress.Spec 后端），
# 子进程是本服务二进制的 re-exec，按部署环境直连 LLM provider 与 git 主机——
# 故如实登记为 unrestricted。若将来接入出口代理强制面（spawn 前 Spec.Env +
# Spec.SatisfiedBy 两半兑现），相应条目应升为 proxy。
egress_paths:
  enabled: true
  severity: error
  entries:
    - path: internal/ocr/internal/command.go
      fn: Run
      mode: unrestricted
      notes: |
        OCR 子进程统一执行入口（三段式 SIGTERM → KillGrace → SIGKILL）。
        子进程是本服务的 re-exec，直连 LLM provider 与平台端点；本进程无出口
        代理强制面，如实登记 unrestricted（出口管控若存在归部署层）。
    - path: internal/ocr/runner.go
      fn: runOnce
      mode: unrestricted
      notes: |
        单次评审的 OCR 运行（re-exec）：出网到 LLM provider。无代理强制面 ⇒ unrestricted。
    - path: internal/ocr/scanner.go
      fn: Preview
      mode: unrestricted
      notes: |
        仓库扫描预览（re-exec）：需要 clone / 拉取与扫描自身出网 ⇒ unrestricted。
    - path: internal/ocr/scanner.go
      fn: Scan
      mode: unrestricted
      notes: |
        仓库扫描（re-exec）：同 Preview，git 与扫描依赖出网 ⇒ unrestricted。
    - path: internal/ocr/delegate.go
      fn: runDelegateCmd
      mode: unrestricted
      notes: |
        delegate 子进程（任务执行/编辑代理）：按需访问 MCP 与网络资源 ⇒ unrestricted。
    - path: internal/ocr/managers.go
      fn: StartViewer
      mode: unrestricted
      notes: |
        本地 viewer 进程：预期只服务本机端口；不设限是事实陈述，显式登记。
    - path: internal/service/suggestion/git.go
      fn: runGitApplyCheck
      mode: unrestricted
      notes: |
        git apply --check 以本地操作为主；git CLI 的网络行为不受本进程约束 ⇒ unrestricted。
    - path: internal/service/suggestion/git.go
      fn: runGitCommand
      mode: unrestricted
      notes: |
        git 命令执行（可能 fetch 远端）：出网到任意 git 主机 ⇒ unrestricted。

# ── 例外登记（rule + path + line 精确豁免；until 到期即重新欠账）──
#
# 全量环境继承（egress_full_env_inherit）4 处：OCR 子进程的环境是**刻意的
# denylist 设计**（internal/ocr/env.go childEnv：先摘宿主凭据，其余保留），
# 改白名单会挡掉 OCR 真正依赖的变量（ssh / CA / 代理 / provider 凭证），
# 后果是「评审跑不起来」。权衡记录在 env.go 包注释里；此为已知债务。
exceptions:
  - rule: harness-subprocess-egress
    path: internal/ocr/delegate.go
    line: 118
    violation: egress_full_env_inherit
    reason: |
      childEnv 是 denylist 设计：先摘宿主凭据（DATABASE_URL / REVIEW_TOKEN /
      MCP_TOKEN / ARGUS_BOT_TOKEN，显式凭证下再摘 provider key），其余全量保留。
      改 procx.ChildEnv 白名单会挡掉 OCR 依赖的 SSH_AUTH_SOCK / GIT_SSH_COMMAND /
      NODE_EXTRA_CA_CERTS / HTTP(S)_PROXY / 未显式下发的 provider 凭证，后果是评审
      跑不起来——env.go 有完整权衡记录。
    until: "2027-05-13"
    removal: childEnv 基底改为 procx.ChildEnv 白名单并覆盖上述变量，经真实评审流水线（ssh clone、provider 凭证、MCP、仓库 hooks）验证后移除
  - rule: harness-subprocess-egress
    path: internal/ocr/runner.go
    line: 412
    violation: egress_full_env_inherit
    reason: |
      同 delegate.go 条目：childEnv denylist 设计，白名单会挡掉 OCR 依赖的
      ssh / CA / 代理 / provider 凭证变量（env.go 权衡记录）。
    until: "2027-05-13"
    removal: childEnv 基底改为 procx.ChildEnv 白名单并覆盖上述变量，经真实评审流水线（ssh clone、provider 凭证、MCP、仓库 hooks）验证后移除
  - rule: harness-subprocess-egress
    path: internal/ocr/scanner.go
    line: 49
    violation: egress_full_env_inherit
    reason: |
      同 delegate.go 条目：childEnv denylist 设计，白名单会挡掉 OCR 依赖的
      ssh / CA / 代理 / provider 凭证变量（env.go 权衡记录）。
    until: "2027-05-13"
    removal: childEnv 基底改为 procx.ChildEnv 白名单并覆盖上述变量，经真实评审流水线（ssh clone、provider 凭证、MCP、仓库 hooks）验证后移除
  - rule: harness-subprocess-egress
    path: internal/ocr/scanner.go
    line: 169
    violation: egress_full_env_inherit
    reason: |
      同 delegate.go 条目：childEnv denylist 设计，白名单会挡掉 OCR 依赖的
      ssh / CA / 代理 / provider 凭证变量（env.go 权衡记录）。
    until: "2027-05-13"
    removal: childEnv 基底改为 procx.ChildEnv 白名单并覆盖上述变量，经真实评审流水线（ssh clone、provider 凭证、MCP、仓库 hooks）验证后移除
