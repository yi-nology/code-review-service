name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  security-events: write

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    env:
      # 限制并发编译的包数：默认并行度下本仓的依赖树峰值内存贴着 runner 上限，
      # 出现过子进程被资源限制杀掉、报错却像编译错误的情况（每次挂的包都不同）。
      GOFLAGS: -p=2
      # Go 的构建临时目录放到 runner 自己的临时目录下（不在 /tmp）：CI 上
      # /tmp 里的构建中间产物曾整体消失（报「open $WORK/bNNN/vet.out: no such
      # file or directory」，每次挂的包都不同）。移出 /tmp 后，出问题时能直接
      # 区分是「谁动了 /tmp」还是别的原因。
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 预取模块并重试：proxy.golang.org 的 CDN 偶发「stream error /
      # INTERNAL_ERROR」（传输层中断，不是版本不存在也不是校验失败）。这类抖动
      # 会让随后的 vet / test 报「read .../@v/xxx.zip: stream error」而红，
      # 但重试通常一次就过——已下载部分进了 module cache，重试只补剩下的。
      - name: Download modules
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if go mod download all; then
              echo "modules ready (attempt $i)"
              exit 0
            fi
            echo "::warning::go mod download failed (attempt $i/5), retrying in 10s"
            sleep 10
          done
          echo "::error::go mod download failed after 5 attempts"
          exit 1

      - name: Check formatting
        # 不用 `test -z "$(gofmt -l ...)"`：命令替换会把文件列表吞掉，
        # 失败时只看到一句 exit code 1，得再本地复现一遍才知道是哪个文件。
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件未格式化（gofmt -w 修正）："
            echo "$unformatted"
            exit 1
          fi


      # 资源诊断：出问题时能直接看到 runner 的磁盘/内存余量，不必再猜。
      # 这个 job 要编译整棵依赖树（eino/otel/grpc/云 SDK/testcontainers），
      # 峰值资源本来就贴着 runner 上限——历史上出现过「刚写好的 vet.out 不存在」
      # 的假失败，那是子进程被资源限制杀掉，不是编译错误。
      - name: Resources
        run: |
          mkdir -p "$RUNNER_TEMP/gotmp"
          df -h / /tmp
          free -m
          go env GOCACHE GOMODCACHE

      - name: Vet
        run: go vet ./...

      # -short：跳过重型集成测试（internal/mcp 的 e2e：testcontainers + 二次完整
      # go build）。该测试由 backend-e2e job 独占机器单独跑。
      #
      # -vet=off：vet 已由上一个步骤（go vet ./...）单独覆盖。go test 内置的
      # vet 动作会在构建中途产出 $WORK/bNNN/vet.out，而 CI 上这些中间产物曾
      # 整体消失（报「can't import facts ...: open $WORK/b793/vet.out: no such
      # file or directory」，且每次挂的包都不同）。去掉这重复的一整类构建动作，
      # 既去掉那条失败路径，也让构建量减半。
      #
      # GOTMPDIR 指向 runner 自己的临时目录（不在 /tmp 下）：Go 的构建临时目录
      # 从此不与 /tmp 同处，出问题时能直接区分是「谁动了 /tmp」还是别的原因。
      - name: Test
        run: |
          # Go 的构建临时目录放到 runner 自己的临时目录下（不在 /tmp 下）：CI 上
          # /tmp 里的构建中间产物曾整体消失（报「open $WORK/bNNN/vet.out: no such
          # file or directory」，每次挂的包都不同）。移出 /tmp 后，出问题时能直接
          # 区分是「谁动了 /tmp」还是别的原因。
          #
          # 用 $RUNNER_TEMP（runner 注入的环境变量）而不是 runner context 的
          # 表达式：runner context 在 job 级 env 里不可用，写在那里会让整个
          # workflow 校验失败（GitHub 报 "likely failed because of a workflow
          # file issue"）。
          export GOTMPDIR="$RUNNER_TEMP/gotmp"
          mkdir -p "$GOTMPDIR"
          go test -short -vet=off ./...

      - name: Vulnerability scan
        uses: golang/govulncheck-action@v1
        with:
          go-package: ./...

      - name: Extended lint
        continue-on-error: true
        uses: golangci/golangci-lint-action@v6
        with:
          args: --timeout=5m

  backend-e2e:
    name: Backend E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if go mod download all; then
              echo "modules ready (attempt $i)"
              exit 0
            fi
            echo "::warning::go mod download failed (attempt $i/5), retrying in 10s"
            sleep 10
          done
          echo "::error::go mod download failed after 5 attempts"
          exit 1

      # 诊断信息：出问题时能直接看到 runner 的磁盘/内存余量，不必再猜。
      - name: Diagnostics
        run: |
          df -h / /tmp
          free -m
          go env GOCACHE GOTMPDIR

      # 只跑 e2e 包，且不加 -short；此时机器由本 job 独占，峰值资源不被外层抢。
      - name: MCP end-to-end
        run: go test -v -timeout 600s ./internal/mcp/...

  # 架构门禁独立成 job：它要编译 archcheck 工具并用 go/parser 扫全仓，
  # 与 Backend job 的 vet+test 叠在同一台 runner 上会把峰值资源推高，
  # 触发「刚写好的 $WORK/xxx/vet.out 不存在」这类假失败（子进程被资源
  # 限制杀掉，报错却像编译错误）。独立 job 让它独占机器。
  architecture:
    name: Architecture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 架构门禁：执行 architecture-policy.yaml 的可执行面（判据来自底座
      # agent-harness/archcheck）。domain 层不得依赖 infra、service 不得摸 ORM、
      # handler 不得直连 postgres 实现——这些原本只是 AGENTS.md 里的散文。
      - name: Architecture policy
        run: go run github.com/yi-nology/agent-harness/cmd/archcheck --report

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
