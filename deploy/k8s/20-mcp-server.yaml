# mcp-server（MCP 协议端点，独立进程，与 review-service 同镜像）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  labels:
    app: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
    spec:
      containers:
      - name: mcp-server
        image: ghcr.io/yi-nology/code-review-service:main
        imagePullPolicy: IfNotPresent
        command: ["/usr/local/bin/mcp-server"]
        ports:
        - containerPort: 8082
        envFrom:
        - secretRef:
            name: review-service-env
        resources:
          requests: {cpu: 250m, memory: 256Mi}
          limits: {cpu: "2", memory: 2Gi}
        # mcp 的 /healthz 是纯存活端点（无 LLM 检查），httpGet 可用。
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8082
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8082
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server
spec:
  type: NodePort
  selector:
    app: mcp-server
  ports:
  - name: http
    port: 8082
    nodePort: 30082
