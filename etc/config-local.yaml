# Review Service 配置文件
# 环境变量会覆盖此文件中的配置

port: 8081

# 认证配置
auth:
  token: "dev-token"

# Webhook 配置
# bot_username 用于识别本服务自身发出的 PR/MR 评论，避免 webhook 回声自循环。
webhook:
  bot_username: "review-bot"

# 数据库配置
database:
  dsn: "${DATABASE_URL:postgres://review_service:review_service@localhost:5432/review_service?sslmode=disable}"
  max_idle_conns: 10
  max_open_conns: 100

# Worker 配置
review:
  worker_concurrency: 2
  worker_poll_interval: "1s"
  worker_stale_after: "15m"
  max_diff_bytes: 5242880
  workspace_cleanup:
    enabled: true
    max_age: "24h"
    interval: "1h"

# OCR 配置
ocr:
  enabled: true
  binary: "/usr/local/bin/ocr"
  rule: ""
  command: ""
  llm:
    url: "https://token-plan-cn.xiaomimimo.com/v1"
    token: "***REMOVED***"
    model: "mimo-v2.5-pro"

# 策略配置
policy:
  fail_on: "critical"
  max_comments: 20
  summary_only: false
  ignore_paths:
    - "vendor/**"
    - "dist/**"
    - "*.pb.go"

# Git 平台配置
git:
  platforms:
    github:
      enabled: true
      base_url: "https://api.github.com"
      token: "${GITHUB_TOKEN:}"
    gitlab:
      enabled: true
      base_url: "https://gitlab.com/api/v4"
      token: "${GITLAB_TOKEN:}"
    gitea:
      enabled: true
      base_url: "${GITEA_BASE_URL:}"
      token: "${GITEA_TOKEN:}"
    gitcode:
      enabled: false
      base_url: "https://api.gitcode.com/api/v5"
      token: "${GITCODE_TOKEN:}"
    gitee:
      enabled: false
      base_url: "https://gitee.com/api/v5"
      token: "${GITEE_TOKEN:}"
    tencent_code:
      enabled: false
      base_url: "https://git.code.tencent.com/api/v3"
      token: "${TENCENT_CODE_TOKEN:}"

# Nacos 配置中心（可选）
nacos:
  addr: "${NACOS_ADDR:}"
  namespace_id: "${NACOS_NAMESPACE:}"
  service_name: "review-service"

# OpenTelemetry 链路追踪（可选）
tracing:
  endpoint: "${OTEL_ENDPOINT:}"
  insecure: true
  sample_rate: 1.0

# 通知配置（可选）
# 评审完成/失败/门禁未通过时推送通知。站内通知默认开启（无需配置），
# 外部 webhook（飞书/企业微信/钉钉）按需配置。
# notification:
#   inapp_disabled: false          # 站内通知开关，默认开启
#   webhooks:
#     - type: feishu               # 渠道类型：feishu / wecom / dingtalk / generic
#       url: "${FEISHU_WEBHOOK_URL:}"
#       secret: "${FEISHU_WEBHOOK_SECRET:}"  # 签名密钥（可选）
#       on: ["failed", "gate_failed"]        # 触发条件，空表示所有事件
#     - type: wecom
#       url: "${WECOM_WEBHOOK_URL:}"
#       on: ["gate_failed"]

# LLM 成本与预算配置（可选）
# 月度成本预算：超额时按 review_action 决定行为。
# 模型单价在 Web 控制台或 /api/v1/settings/cost/pricing 维护。
# cost:
#   monthly_budget_usd: 100.0      # 月度预算上限（美元），0 表示不限制
#   review_action: "warn"          # warn（仅告警，默认）/ block（拒绝新评审）
