port: 8080

auth:
  token: "${REVIEW_TOKEN}"

database:
  dsn: "${DATABASE_URL}"
  max_idle_conns: 20
  max_open_conns: 100

review:
  worker_concurrency: 8
  worker_poll_interval: "1s"
  worker_stale_after: "15m"
  max_diff_bytes: 10485760

# OCR、策略、Git 平台等业务配置已迁移到数据库，通过 Web 控制台管理。

nacos:
  addr: "${NACOS_ADDR}"
  namespace_id: "${NACOS_NAMESPACE}"
  service_name: "review-service"

tracing:
  endpoint: "${OTEL_ENDPOINT}"
  insecure: false
  sample_rate: 0.1

# Argus 对接（可选）
# Argus Bot（外部 PR 审查引擎）基地址与 API token（即 argus 侧 ARGUS_APITOKEN）。
# bot_url 为空 = argus 引擎整体关闭（创建期 fail-fast、轮询器与反馈回流不启动）。
# 也可用环境变量 ARGUS_BOT_URL / ARGUS_BOT_TOKEN 覆盖。
# argus:
#   bot_url: "http://argus:8899"
#   bot_token: "${ARGUS_BOT_TOKEN:}"
# 对外基地址：PR 门禁 check 跳转评审详情页链接；留空则不携带 target_url
# external_base_url: http://review.example.com
