services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: review_service
      POSTGRES_USER: review_service
      POSTGRES_PASSWORD: review_service
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U review_service -d review_service"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - review-postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  review-service:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      REVIEW_TOKEN: ${REVIEW_TOKEN:-dev-token}
      DATABASE_URL: postgres://review_service:review_service@postgres:5432/review_service?sslmode=disable
      OCR_ENABLED: ${OCR_ENABLED:-false}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      GITEA_TOKEN: ${GITEA_TOKEN:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    depends_on:
      - review-service
    ports:
      - "80:80"

volumes:
  review-postgres:
